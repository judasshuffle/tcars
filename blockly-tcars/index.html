<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Blocky T.C.a.R.S.</title>
  <script src="google-blockly-8d87f73/blockly_compressed.js"></script>
  <script src="google-blockly-8d87f73/blocks_compressed.js"></script>
  <script src="google-blockly-8d87f73/javascript_compressed.js"></script>
  <script src="google-blockly-8d87f73/msg/js/en.js"></script>
  <script src="msg/en.js"></script>
  <style type="text/css">
    html, body {
      height: 100%;
    }

    body {
      background-color: #fff;
      font-family: sans-serif;
      margin: 0;
      overflow: hidden;
    }

    .farSide {
      text-align: right;
    }

    html[dir="RTL"] .farSide {
      text-align: left;
    }

    /* Buttons */
    button {
      margin: 5px;
      padding: 10px;
      border-radius: 4px;
      border: 1px solid #ddd;
      font-size: large;
      background-color: #eee;
      color: #000;
    }
    button.primary {
      border: 1px solid #dd4b39;
      background-color: #dd4b39;
      color: #fff;
    }
    button.primary>img {
      opacity: 1;
    }
    button>img {
      opacity: 0.6;
      vertical-align: text-bottom;
    }
    button:hover>img {
      opacity: 1;
    }
    button:active {
      border: 1px solid #888 !important;
    }
    button:hover {
      box-shadow: 2px 2px 5px #888;
    }
    button.disabled:hover>img {
      opacity: 0.6;
    }
    button.disabled {
      display: none;
    }
    button.notext {
      font-size: 10%;
    }

    h1 {
      font-weight: normal;
      font-size: 140%;
      margin-left: 5px;
      margin-right: 5px;
    }

    /* Tabs */
    #tabRow>td {
      border: 1px solid #ccc;
      border-bottom: none;
    }
    td.tabon {
      border-bottom-color: #ddd !important;
      background-color: #ddd;
      padding: 5px 19px;
    }
    td.taboff {
      cursor: pointer;
      padding: 5px 19px;
    }
    td.taboff:hover {
      background-color: #eee;
    }
    td.tabmin {
      border-top-style: none !important;
      border-left-style: none !important;
      border-right-style: none !important;
    }
    td.tabmax {
      border-top-style: none !important;
      border-left-style: none !important;
      border-right-style: none !important;
      width: 99%;
      padding-left: 10px;
      padding-right: 10px;
      text-align: right;
    }
    html[dir=rtl] td.tabmax {
      text-align: left;
    }

    table {
      border-collapse: collapse;
      margin: 0;
      padding: 0;
      border: none;
    }
    td {
      padding: 0;
      vertical-align: top;
    }
    .content {
     /* visibility: hidden;*/
      margin: 0;
      padding: 1ex;
      position: absolute;
      direction: ltr;
    }
    pre.content {
      border: 1px solid #ccc;
      overflow: scroll;
    }
    #content_blocks {
      padding: 0;
    }
    .blocklySvg {
      border-top: none !important;
    }
    #content_xml {
      resize: none;
      outline: none;
      border: 1px solid #ccc;
      font-family: monospace;
      overflow: scroll;
    }
    #languageMenu {
      vertical-align: top;
      margin-top: 15px;
      margin-right: 15px;
    }

    /* Buttons */
    button {
      padding: 1px 10px;
      margin: 1px 5px;
    }

    /* Sprited icons. */
    .icon21 {
      height: 21px;
      width: 21px;
      background-image: url(icons.png);
    }
    .trash {
      background-position: 0px 0px;
    }
    .link {
      background-position: -21px 0px;
    }
    .run {
      background-position: -42px 0px;
    }
  </style>
</head>
<body id="content_area">
  <div id="content_blocks" class="content"></div>
  <xml id="toolbox" style="display: none">
    <block type="running"></block>
    <block type="drive_forwards"></block>
  </xml>
  <script type="text/javascript">
    var getBBox_ = function(element) {
        var height = element.offsetHeight;
        var width = element.offsetWidth;
        var x = 0;
        var y = 0;
        do {
            x += element.offsetLeft;
            y += element.offsetTop;
            element = element.offsetParent;
        } while (element);
        return {
            height: height,
            width: width,
            x: x,
            y: y
        };
    };

    Blockly.Blocks['running'] = {
      init: function() {
        this.appendDummyInput().appendField("Car Start");
        this.setInputsInline(true);
        this.setNextStatement(true);
        this.setColour(65);
        //this.setTooltip('');
        //this.setHelpUrl('http://www.example.com/');
      }
    };

    Blockly.Blocks['drive_forwards'] = {
      init: function() {
        this.appendDummyInput().appendField("Drive forwards");
        this.setPreviousStatement(true);
        this.setNextStatement(true);
        this.setColour(210);
        //this.setTooltip('');
        //this.setHelpUrl('http://www.example.com/');
      }
    };

    Blockly.JavaScript['running'] = function(block) {
      // TODO: Assemble JavaScript into code variable.
      var code = '...';
      return code;
    };

    Blockly.JavaScript['drive_forwards'] = function(block) {
      // TODO: Assemble JavaScript into code variable.
      var code = '...';
      return code;
    };

    var workspace = Blockly.inject('content_blocks', {
        grid: {
            spacing: 25,
            length: 3,
            colour: '#ccc',
            snap: true
        },
        media: 'google-blockly-8d87f73/media/',
        toolbox: document.getElementById('toolbox')
    });

    var container = document.getElementById('content_area');
    var onresize = function(e) {
        var bBox = getBBox_(container);
        var el = document.getElementById('content_blocks');
        el.style.top = bBox.y + 'px';
        el.style.left = bBox.x + 'px';
        el.style.height = bBox.height + 'px';
        el.style.height = (2 * bBox.height - el.offsetHeight) + 'px';
        el.style.width = bBox.width + 'px';
        el.style.width = (2 * bBox.width - el.offsetWidth) + 'px';
    };

    var rootBlock = Blockly.Block.obtain(workspace, 'running');
    rootBlock.initSvg();
    rootBlock.render();
    rootBlock.setMovable(false);
    rootBlock.setDeletable(false);

    window.addEventListener('resize', onresize, false);
    onresize();
  </script>
</body>
</html>
