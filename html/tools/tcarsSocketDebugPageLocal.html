<!DOCTYPE html>
<meta charset="utf-8" /> 
<title>WebSocket Test</title>
<script src="https://dl.dropboxusercontent.com/u/14997455/hifi/tcars/libraries/constants.js" type="text/javascript"></script>
<script src="https://code.jquery.com/jquery-2.1.4.min.js" type="text/javascript"></script>
<script language="javascript" type="text/javascript">
var wsUri = "ws://toycars.highfidelity.io:18000/";
var output;

$(function() {
    output = document.getElementById("output");
    testWebSocket();
});

function testWebSocket() {
    websocket = new WebSocket(wsUri);
    websocket.onopen = function(evt) { onOpen(evt) };
    websocket.onclose = function(evt) { onClose(evt) };
    websocket.onmessage = function(evt) { onMessage(evt) };
    websocket.onerror = function(evt) { onError(evt) };
    $('#btn_request_session').on('click', function() {
        websocket.send(JSON.stringify({action: LOBBY_ACTION.REGISTER_SESSION_REQUEST}))
    });
    $('#btn_list_sessions').on('click', function() {
        websocket.send(JSON.stringify({action: LOBBY_ACTION.PLAYER_SESSIONS_REQUEST}))
    });
    
}

function onOpen(evt) {
    writeToScreen("CONNECTED");
    //doSend("WebSocket rocks");
} 

function onClose(evt) {
    writeToScreen("DISCONNECTED");
}

function onMessage(evt) {
    writeToScreen('<span style="color: blue;">RESPONSE: ' + evt.data + '</span>');
    var data = JSON.parse(evt.data);
    switch (data.action) {
        case ACTION.JOIN_REQUEST:
            writeToScreen('ha');
            websocket.send(JSON.stringify({
                action: ACTION.JOIN_REQUEST_ACCEPTED,
                name: prompt("Enter ur name", "User#" + Math.floor(Math.random() * 10000))
            }));
            break;
        case ACTION.MESSAGE:
            // Once a new message is receive we add it to our message viewer.
            writeToScreen(data.message);
            break;
        case ACTION.PLAYER_JOIN:
            // A player joined, we log it.
            writeToScreen(data.name + " joined.");
            //playerList.addPlayer(data.id, data.name);
            break;
    }
    //websocket.close();
}

function onError(evt) {
    writeToScreen('<span style="color: red;">ERROR:</span> ' + evt.data);
}

function doSend(message) {
    writeToScreen("SENT: " + message);
    websocket.send(message);
}

function writeToScreen(message) {
    var pre = document.createElement("p");
    pre.style.wordWrap = "break-word";
    pre.innerHTML = message;
    output.appendChild(pre);
}
</script> 
<h2>WebSocket Test</h2>
<div id="output"></div>
<button id="btn_request_session">Request session</button>
<button id="btn_list_sessions">List sessions</button>
