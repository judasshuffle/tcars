<html>
    <head>
    <title>Export window</title>
    <style type="text/css">
    #export_result {
        width: 100%;
        height: 90%;
    }
    </style>
        <script src="https://code.jquery.com/jquery-2.1.4.min.js"></script>
        <script type="text/javascript" src="qrc:///qtwebchannel/qwebchannel.js"></script>
        <script type="text/javascript" src="eventBridgeLoader.js"></script>
        <script type="text/javascript">
            function sendWebEvent(data) {
                EventBridge.emitWebEvent(JSON.stringify(data));
            }

            $(function() {
                openEventBridge(function () {
                    EventBridge.scriptEventReceived.connect(function (data) {
                        data = JSON.parse(data);
                        if (data.action == 'export') {
                            $('#export_result').val(JSON.stringify(data.data, null, 4) + "\n");
                        }
                    });
                    sendWebEvent({action: 'page_loaded'});
                });
            });
        </script>
    </head>
    <body>
        <div>Export result</div>
        <div>
            <textarea title="export result" id="export_result"></textarea>
        </div>
    </body>
</html>
