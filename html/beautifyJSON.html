<html>
<head>
<title>Import window</title>
<style type="text/css">
#import_json {
    width: 100%;
    height: 90%;
}
</style>
<script src="https://code.jquery.com/jquery-2.1.4.min.js"></script>
<script type="text/javascript">
function beautifyJSON() {
    
    $('#input_json').val(JSON.stringify(JSON.parse($('#input_json').val()), null, 4) + "\n");
    //sendWebEvent({action: "import_json", data: $('#import_json').val()});
}
</script>
</head>
<body>
	<div>TrackZone JSON Beautifier</div>
    <div>
        <textarea id="input_json"></textarea>
    </div>
    <div>
        <button onclick="beautifyJSON()" >Beautify JSON</button>
    </div>
</body>
</html>
